    <link rel="stylesheet" href="assets/quiz.css">
    <link rel="shortcut icon" type="imagex/png" href="assets/images/IFRN_logo.svg">
    <title>?RN CNAT - Enigma 2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Karantina:wght@300;400;700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<body>
    <main>
        <div class="comando">
            <h1><img src="assets/images/int.svg" alt="Interrogação branca"></h1>
            <div class="texto">
                <p class="bemvindo mediumtext">O grande</p>
                <h2 class="titulo">Diretor</h1>
                <p class="text mediumtext">Olá de novo, jogador. <br> Um histórico diretor de aprendizes desempenhou um papel histórico. Hoje, SEU NOME guarda livros no centro... </p>

                <div class="form">
                    <form id="form">
                        <label for="filename" class="filename">
                            <input type="text" id="filename" name="filename" value="enigma2.html" class="filename">
                        </label>
                        <label for="resposta">
                            <input type="text" id="resposta" name="resposta" placeholder="Resposta">
                        </label>
                        <button type="submit"><img src="assets/images/Send.svg" alt="Send"></button>
                    </form>
                </div>

                <span id="error" class="mediumtext error">Resposta errada! Verifique-a.</span>
            </div>
        </div>
        <div class="image" >
            <img src="assets/images/Book.svg" alt="Fachada do IFRN">
        </div>

        <nav class="opc">

                    <li><a href="https://github.com/Heitorfrancab/Heitorfrancab.github.io"><img src="assets/images/GitHub.svg" alt="GitHub"></a></li>
                    <li><a href="mailto:pinheiro.arthur@escolar.ifrn.edu.br"><img src="assets/images/Mail.svg" alt="Contact"></a></li>
